<!doctype html><html><head><meta charset="utf-8"><title>NEBians News Ep1 renderer</title>
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(fonts/poppins-latin-400-normal.woff2)}
@font-face{font-family:Poppins;font-weight:500;src:url(fonts/poppins-latin-500-normal.woff2)}
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2)}
@font-face{font-family:Poppins;font-weight:700;src:url(fonts/poppins-latin-700-normal.woff2)}
@font-face{font-family:'Noto Sans Devanagari';font-weight:400;src:url(fonts/noto-sans-devanagari-devanagari-400-normal.woff2)}
@font-face{font-family:'Noto Sans Devanagari';font-weight:500;src:url(fonts/noto-sans-devanagari-devanagari-400-normal.woff2)}
@font-face{font-family:'Noto Sans Devanagari';font-weight:600;src:url(fonts/noto-sans-devanagari-devanagari-600-normal.woff2)}
@font-face{font-family:'Noto Sans Devanagari';font-weight:700;src:url(fonts/noto-sans-devanagari-devanagari-700-normal.woff2)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="cv" width="1920" height="1080"></canvas>
<script src="data.js"></script><script src="m3.js"></script><script src="parts.js"></script><script src="scenes.js"></script><script src="main.js"></script>
<script>
window.ctx = document.getElementById('cv').getContext('2d');
window.ready = (async () => { const f = ['400','500','600','700'];
  for (const w of f) { await document.fonts.load(w + ' 40px Poppins'); await document.fonts.load(w + " 40px 'Noto Sans Devanagari'", 'नमस्ते सखिया'); }
  await document.fonts.ready; return true; })();
</script></body></html>
