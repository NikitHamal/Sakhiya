<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sakhiya · Listening Desk</title>
<style>body{font:15px/1.5 system-ui,sans-serif;margin:0;background:#0f1115;color:#e8e8ee}main{max-width:1000px;margin:auto;padding:20px}
h1{margin:.2em 0}a{color:#8ab4ff}.pack{background:#171a21;border:1px solid #2a2f3a;border-radius:12px;padding:14px 16px;margin:16px 0}
.pack h2{margin:0 0 4px;font-size:18px}.pack small{color:#9aa3b2}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:10px}
.clip{background:#10131a;border-radius:8px;padding:8px 10px}.clip b{display:block;font-size:13px;margin-bottom:4px}audio{width:100%;height:34px}
.tabs button{background:#232836;color:#e8e8ee;border:0;border-radius:20px;padding:6px 14px;margin:2px;cursor:pointer}.tabs button.on{background:#4c7dff}</style></head>
<body><main><h1>🎧 Sakhiya Listening Desk</h1>
<p><small>All frozen 15-clip packs, straight from <code>samples/versions/</code>. Pick a pack, press play. <a href="index.html">Back to Studio</a> · <a href="index.html#ampixa">Ampixa self-test (365 prompts)</a></small></p>
<div class="tabs" id="tabs"></div><div id="out">Loading…</div>
<script>
const WANT=["sakhiya_pro_v3","sakhiya_v3_t30","sakhiya_v3_t15","sakhiya_v3_t10","sakhiya_v3_t5","sakhiya_v3_t1","sakhiya_pro_v4_vedic","sakhiya_pro_v4","sakhiya_v4_micro","sakhiya_v4_pico"];
fetch("samples/versions/registry.json").then(r=>r.json()).then(REG=>{
  const vs=REG.versions; const order=[...WANT,...vs.map(v=>v.tag).filter(t=>!WANT.includes(t)).reverse()];
  const by=Object.fromEntries(vs.map(v=>[v.tag,v])); const tags=order.filter(t=>by[t]);
  const tabs=document.getElementById("tabs"),out=document.getElementById("out");
  const show=t=>{[...tabs.children].forEach(b=>b.classList.toggle("on",b.dataset.t===t));
    const v=by[t],m=v.metrics||{};
    const files=(v.clips||v.files||[]);
    out.innerHTML=`<div class="pack"><h2>${v.label}</h2><small>${v.notes||""}</small><div class="grid" id="g"></div></div>`;
    const g=document.getElementById("g");
    const esc=x=>String(x||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    fetch(`samples/versions/${t}/manifest.json`).then(r=>r.json()).then(mf=>{
      (mf.clips||[]).forEach(c=>{const d=document.createElement("div");d.className="clip";
        d.innerHTML=`<b>${esc(c.id)} <small>${esc(c.style||"")}</small></b><small>${esc(c.text)}</small><audio controls preload="none" src="${c.mp3||`samples/versions/${t}/${c.id}.mp3`}"></audio>`;g.appendChild(d)});
    }).catch(e=>{g.textContent="manifest error: "+e});
  };
  tags.forEach(t=>{const b=document.createElement("button");b.textContent=t;b.dataset.t=t;b.onclick=()=>show(t);tabs.appendChild(b)});
  show(tags[0]);
}).catch(e=>{document.getElementById("out").textContent="Could not load registry: "+e});
</script></main></body></html>
